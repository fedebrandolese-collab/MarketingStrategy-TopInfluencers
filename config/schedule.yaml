# When the system runs by itself (src/wearable_wishlist/schedule.py reads this file; src/wearable_wishlist/ops.py runs it).
# One trigger a day at `daily_at` (local time of the machine). Each run does only the stages that are due: a stage is
# due when its last successful run is at least `every_days` old (a few hours of slack, so a 06:05 run yesterday does not
# skip today). Free stages run every day; paid ones less often. A stage whose provider reached its monthly cap is
# skipped (and says so); the free stages still run, so the list keeps re-scoring with today's dates.
daily_at: "06:00"

stages:                 # every_days per stage; 0 = never by schedule (run it by hand: make <stage>)
  ingest: 1             # free: re-reads the operator's map from the read-only mirror in data/raw
  crawl: 7              # paid (monid): the operator's follow graph
  resolve: 7            # paid (X API): handles for new map contacts
  discover: 7           # paid (monid): the topic, competitor, author and evidence searches
  expand: 14            # paid (monid): who the best people follow
  enrich: 1             # paid (monid): posts of new candidates (refresh after 30 days)
  classify: 1           # LLM: reads the new posts (free on claude_cli, paid on the anthropic backend)
  verify: 1             # paid (X API): confirms new handles near the top (skips handles checked within 7 days)
  paths: 1              # free
  sample: 1             # paid (monid): latest posts of new people on the list (refresh after 14 days)
  score: 1              # free
  export: 1             # free

budget:
  month_usd:            # per provider, calendar month; reaching it skips that provider's stages until the 1st
    monid: 40
    x_api: 10
    anthropic: 20
