[project]
name = "wearable-wishlist"
version = "0.1.0"
description = "Wearable wishlist: crawlers, scoring, paths and dashboard"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31",
  "python-dotenv>=1.0",
  "streamlit>=1.30",
  "pandas>=2.0",
  "rapidfuzz>=3.0",
  "anthropic>=0.40",
  "pyyaml>=6.0",
]
[project.optional-dependencies]
dev = ["pytest>=8.0"]
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
